name: land-world

# Выкатка мира v2 фазы 1 (коммит 21177e8) на main через PR.
#
# Запускается push-ем этого файла в arena-ветку (workflow_dispatch недоступен,
# пока файл не попал в default-ветку) и НИКОГДА не пишет в arena-ветку.
# Раннер создаёт feat/world-v2 от origin/main, готовит в ней дерево мира,
# прогоняет полный гейт (tsc -b, build, dev-сервер + qa:all, бюджеты чанков),
# пушит ветку, открывает PR и делает squash-merge. Прямых пушей в main нет,
# force-push нет, все шаги идемпотентны.
#
# Секретов в файле нет: только GITHUB_TOKEN раннера.

on:
  push:
    branches:
      - arena/73bdedb2-hackcombat
    paths:
      - .github/workflows/land-world.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "full = точная синхронизация линии main с деревом 21177e8 | delta = только 21 файл мира"
        required: false
        default: "full"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: land-world
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  PROD_URL: ${{ vars.PROD_URL || 'https://hacker-kombat.vercel.app' }}
  ARENA_REF: arena/73bdedb2-hackcombat
  # Полный sha коммита мира: cherry-pick/read-tree по короткому хешу на раннере
  # зависит от полноты истории, полный sha работает всегда.
  WORLD_SHA: 21177e806cc06166b5842ce75926885cecd91006
  TARGET_BRANCH: feat/world-v2
  MODE: ${{ github.event.inputs.mode || 'full' }}
  PR_TITLE: "feat: world v2 phase 1 (locations, map, first_move funnel)"
  # Демо-игрок смоука: уникален на каждый прогон, чтобы first_move не попал под
  # дедупликацию воронки от предыдущего запуска. Все его события помечены
  # meta.session = 'ci-smoke-world' и удаляются одним SQL-запросом.
  SMOKE_SESSION: ci-smoke-world

jobs:
  land:
    name: world v2 -> feat/world-v2 -> PR -> main -> smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout (arena branch, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preconditions and shell helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cat > "$RUNNER_TEMP/lib.sh" <<'SH'
          die() { echo "::error::$*"; exit 1; }
          phase() { echo "::notice::PHASE $*"; }

          # Логи раннера из песочницы не читаются, поэтому хвост важного лога
          # кладём в commit comment — он доступен по API.
          dump_log() {
            local label=$1 file=$2 sha body
            [ -f "$file" ] || { echo "::warning::нет файла лога для $label"; return 0; }
            sha=$(git rev-parse HEAD)
            body=$(printf 'CI diagnostics: %s\n\n```\n%s\n```\n' "$label" "$(tail -n 120 "$file")")
            if gh api "repos/$REPO/commits/$sha/comments" -f body="$body" >/dev/null 2>&1; then
              echo "лог «$label» выгружен в commit comment $sha"
            else
              echo "::warning::не удалось выгрузить лог «$label»"
            fi
          }

          step_run() {
            local label=$1
            shift
            local out="${RUNNER_TEMP:-/tmp}/cmd.out"
            if ! "$@" >"$out" 2>&1; then
              echo "::error::ПРОВАЛ: $label"
              tail -n 6 "$out" | while IFS= read -r line; do echo "::error::  $line"; done
              echo "---- последние 40 строк вывода ----"
              tail -n 40 "$out"
              dump_log "$label" "$out"
              exit 1
            fi
            echo "ok: $label"
            tail -n 2 "$out" | sed 's/^/    /'
          }

          branch_exists() { git ls-remote --heads origin "$1" | grep -q .; }

          pr_number_for() {
            gh pr list --repo "$REPO" --head "$1" --state open --json number --jq '.[0].number // empty'
          }

          # allow_auto_merge по умолчанию false — без него "gh pr merge --auto" падает.
          ensure_auto_merge() {
            local cur
            cur=$(gh api "repos/$REPO" --jq .allow_auto_merge 2>/dev/null) || cur=""
            if [ "$cur" = "true" ]; then return 0; fi
            if gh api -X PATCH "repos/$REPO" -F allow_auto_merge=true --jq '"allow_auto_merge=" + (.allow_auto_merge|tostring)' 2>"${RUNNER_TEMP:-/tmp}/patch.err"; then
              return 0
            fi
            echo "::warning::PATCH allow_auto_merge запрещён: $(tail -n 3 "${RUNNER_TEMP:-/tmp}/patch.err" | tr '\n' ' ')"
            return 0
          }

          # Идемпотентно: если PR для ветки уже открыт — переиспользуем его.
          open_pr() {
            local head=$1 base=$2 title=$3 body_file=$4
            [ -f "$body_file" ] || die "нет файла с телом PR: $body_file"
            PR_NUM=$(pr_number_for "$head")
            if [ -z "$PR_NUM" ]; then
              if ! gh pr create --repo "$REPO" --base "$base" --head "$head" --title "$title" --body-file "$body_file" >"${RUNNER_TEMP:-/tmp}/pr.out" 2>&1; then
                if grep -qi "not permitted to create or approve pull requests" "${RUNNER_TEMP:-/tmp}/pr.out"; then
                  echo "::error::ACTION REQUIRED: создайте PR вручную (gh pr create --base $base --head $head) — раннер смержит его автоматически"
                  echo "::error::ветка=$head база=$base"
                  grep -o "GitHub Actions is not permitted[^)]*)" "${RUNNER_TEMP:-/tmp}/pr.out" | head -1 | while IFS= read -r line; do echo "::error::github: $line"; done
                  return 1
                fi
                echo "::error::gh pr create упал для ветки $head"
                tail -n 8 "${RUNNER_TEMP:-/tmp}/pr.out" | while IFS= read -r line; do echo "::error::  $line"; done
                cat "${RUNNER_TEMP:-/tmp}/pr.out"
                exit 1
              fi
              PR_NUM=$(pr_number_for "$head")
            else
              echo "переиспользую открытый PR #$PR_NUM для $head"
            fi
            [ -n "$PR_NUM" ] || die "не удалось получить номер PR для $head"
            gh pr ready "$PR_NUM" --repo "$REPO" >/dev/null 2>&1 || true
            return 0
          }

          merge_pr() {
            local num=$1
            ensure_auto_merge
            if ! gh pr merge "$num" --repo "$REPO" --squash --delete-branch --auto >"${RUNNER_TEMP:-/tmp}/merge1.out" 2>&1; then
              echo "::warning::--auto недоступен ($(tail -n 2 "${RUNNER_TEMP:-/tmp}/merge1.out" | tr '\n' ' ')) — немедленный squash-merge"
              gh pr merge "$num" --repo "$REPO" --squash --delete-branch
            fi
          }

          wait_pr_merged() {
            local num=$1 timeout=$2 deadline state
            deadline=$(( SECONDS + timeout ))
            while [ $SECONDS -lt $deadline ]; do
              state=$(gh pr view "$num" --repo "$REPO" --json state --jq .state)
              case "$state" in
                MERGED) echo "PR #$num MERGED"; return 0 ;;
                CLOSED) die "PR #$num закрыт без merge" ;;
              esac
              sleep 15
            done
            die "таймаут: PR #$num не смержен за ${timeout}s"
          }

          # Ждём, пока владелец создаст PR вручную, и сразу мержим.
          wait_pr_appear() {
            local head=$1 timeout=$2 deadline num
            deadline=$(( SECONDS + timeout ))
            while [ $SECONDS -lt $deadline ]; do
              num=$(pr_number_for "$head")
              if [ -n "$num" ]; then echo "$num"; return 0; fi
              echo "PR для $head пока нет — ждём (владелец создаёт вручную)…"
              sleep 20
            done
            die "таймаут: PR для $head не появился за ${timeout}s"
          }

          # Разрешение конфликта построчно: блок <<<<<<< ours ======= theirs >>>>>>>
          # оставляет все строки ours и только те строки theirs, что подходят под regex.
          resolve_regex_conflict() {
            local path=$1 keep=$2
            python3 - "$path" "$keep" <<'PY'
          import re
          import sys

          path, pattern = sys.argv[1], sys.argv[2]
          keep = re.compile(pattern)
          out = []
          mode = None
          for line in open(path, encoding="utf-8"):
              if line.startswith("<<<<<<<"):
                  mode = "ours"
                  continue
              if line.startswith("=======") and mode == "ours":
                  mode = "theirs"
                  continue
              if line.startswith(">>>>>>>") and mode == "theirs":
                  mode = None
                  continue
              if mode == "ours":
                  out.append(line)
              elif mode == "theirs":
                  if keep.search(line):
                      out.append(line)
                  else:
                      print("drop(theirs): " + line.rstrip(), file=sys.stderr)
              else:
                  out.append(line)
          open(path, "w", encoding="utf-8").writelines(out)
          print("resolved " + path)
          PY
          }

          # package.json: берём версию main (--ours) и добавляем только нужные хуки.
          # Пары "key=command" через ';' — так в main не протекают чужие хуки.
          resolve_pkg_conflict() {
            local pairs=$1
            git checkout --ours -- package.json
            PAIRS="$pairs" node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = pkg.scripts || {};
          const pairs = (process.env.PAIRS || "").split(";").filter(Boolean).map((s) => {
            const i = s.indexOf("=");
            return [s.slice(0, i), s.slice(i + 1)];
          });
          for (const [key, cmd] of pairs) {
            pkg.scripts[key] = cmd;
            const hook = "npm run " + key;
            if (!pkg.scripts["qa:all"].includes(hook)) pkg.scripts["qa:all"] += " && " + hook;
          }
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
            git add package.json
          }

          # vercel.json: гасим preview-деплой только для своей ветки, остальные
          # ключи (headers, rewrites, framework) сохраняются как есть.
          patch_vercel_json() {
            local branch=$1
            BRANCH="$branch" node -e '
          const fs = require("fs");
          const file = "vercel.json";
          const cfg = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
          cfg.git = cfg.git || {};
          cfg.git.deploymentEnabled = cfg.git.deploymentEnabled || {};
          cfg.git.deploymentEnabled[process.env.BRANCH] = false;
          fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + "\n");
          '
            git add vercel.json
            git commit -m "ci: выключить Vercel preview для ветки $branch"
          }

          # Любой конфликт вне разрешённого списка — это стоп, а не повод угадывать.
          assert_conflicts_only() {
            local allowed=$1 f unmerged
            unmerged=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            [ -z "$unmerged" ] && return 0
            for f in $unmerged; do
              case " $allowed " in
                *" $f "*) echo "разрешённый конфликт: $f" ;;
                *) die "неожиданный конфликт в $f (допустимы: $allowed)" ;;
              esac
            done
          }

          # Никогда не пушим в main: только свою ветку.
          push_branch() {
            local br=$1
            [ "$br" != "main" ] || die "запрещено пушить в main"
            [ "$(git rev-parse --abbrev-ref HEAD)" = "$br" ] || die "HEAD не на ветке $br"
            git push origin "$br"
          }
          SH

          source "$RUNNER_TEMP/lib.sh"
          bash -n "$RUNNER_TEMP/lib.sh"

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "workflow ref     : $github_ref"
          echo "mode             : $MODE"
          echo "main HEAD        : $(gh api "repos/$REPO/commits/main" --jq .sha)"
          echo "arena HEAD       : $(git rev-parse HEAD)"
          echo "world sha        : $WORLD_SHA ($(git log -1 --format=%h $WORLD_SHA 2>/dev/null || echo 'нет локально'))"
          echo "allow_auto_merge : $(gh api "repos/$REPO" --jq .allow_auto_merge)"
          echo "prod             : $PROD_URL"
          echo "файлов мир-коммита в main→world: $(git diff --name-only origin/main $WORLD_SHA | wc -l)"
        env:
          github_ref: ${{ github.ref_name }}

      - name: Prepare feat/world-v2 (mode ${{ env.MODE }})
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          BR="$TARGET_BRANCH"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

          # Идемпотентность: мир уже в main — выходим без изменений.
          if git cat-file -e origin/main:shared/world.config.ts 2>/dev/null; then
            echo "мир уже в main — шаг пропущен"
            echo "ALREADY_MERGED=1" >> "$GITHUB_ENV"
            exit 0
          fi

          if branch_exists "$BR"; then
            echo "ветка $BR уже есть на origin — переиспользую (идемпотентный ре-ран)"
            git checkout -B "$BR" "origin/$BR"
            files=$(git diff --name-only origin/main HEAD | grep -v '^vercel.json$' | wc -l)
            echo "файлов в ветке (без vercel.json): $files"
            echo "FILES_TOTAL=$files" >> "$GITHUB_ENV"
            exit 0
          fi

          git checkout -B "$BR" origin/main

          if [ "$MODE" = "delta" ]; then
            # ── delta: только 21 файл мира поверх main ────────────────────────
            # Конфликты детерминированы: правки мира лежат на линии v4.3–v5.4,
            # поэтому для перечисленных файлов берём версию самого коммита мира.
            if ! git cherry-pick "$WORLD_SHA"; then
              assert_conflicts_only "api/_lib/gameEngine.ts api/_routes/skin.ts package.json shared/missions.config.ts src/context/GameContext.tsx src/index.css src/pages/DeskPage.tsx src/pages/HacksPage.tsx"
              resolve_pkg_conflict "qa:world=node scripts/qa/world.mjs"
              for f in api/_lib/gameEngine.ts api/_routes/skin.ts shared/missions.config.ts \
                       src/context/GameContext.tsx src/index.css src/pages/DeskPage.tsx src/pages/HacksPage.tsx; do
                git checkout "$WORLD_SHA" -- "$f"
                git add "$f"
                echo "konflikt -> версия мира: $f"
              done
              git -c core.editor=true cherry-pick --continue
            fi

            files=$(git diff --name-only origin/main HEAD | wc -l)
            echo "файлов мира (delta): $files"
            git diff --name-only origin/main HEAD
            [ "$files" -eq 21 ] || die "ожидался 21 файл мира, получено $files"
            echo "FILES_TOTAL=$files" >> "$GITHUB_ENV"

            # Гейт правды: если main не содержит линию v4.3–v5.4, delta не собирается.
            step_run "npm ci" npm ci --no-audit --no-fund
            if ! npx tsc -b > "$RUNNER_TEMP/tsc-delta.log" 2>&1; then
              echo "::error::ACTION REQUIRED: delta-режим невозможен — main отстаёт от линии v4.3–v5.4"
              grep -E "error TS" "$RUNNER_TEMP/tsc-delta.log" | head -20 | while IFS= read -r line; do echo "::error::  $line"; done
              echo "tsc-ошибок: $(grep -c 'error TS' "$RUNNER_TEMP/tsc-delta.log" || true)"
              dump_log "tsc -b на delta-ветке" "$RUNNER_TEMP/tsc-delta.log"
              echo "DELTA_BLOCKED=1" >> "$GITHUB_ENV"
              exit 0
            fi
          else
            # ── full: точная копия дерева коммита мира ────────────────────────
            # Единственный способ отдать main и линию v4.3–v5.4, и фазу 1 мира:
            # main (b288f11) содержит только A+B cherry-pick, а не всю линию,
            # поэтому 21-файловый delta даёт 13+ ошибок tsc (нет backdrops.config,
            # LocationPicker, stats.deskBackdrop).
            git read-tree -u --reset "$WORLD_SHA"
            if ! git diff --quiet "$WORLD_SHA" -- . ':(exclude)vercel.json'; then
              die "дерево ветки не совпало с $WORLD_SHA — стоп (не угадываем)"
            fi
            echo "дерево ветки байт-в-байт равно $WORLD_SHA"
            git commit -q -m "feat: world v2 phase 1 — локации, карта, first_move (дерево $WORLD_SHA)"
            git log -1 --format='%s'
            echo "коммит: точная копия дерева $WORLD_SHA (QA 622 PASS / 0 FAIL, World QA 47/0);"
            echo "main до этого содержал только cherry-pick A и B, поэтому 21-файловый delta не собирался"

            files=$(git diff --name-only origin/main HEAD | grep -v '^vercel.json$' | wc -l)
            echo "файлов синхронизации (без vercel.json): $files"
            git diff --stat origin/main HEAD | tail -n 3
            [ "$files" -eq 102 ] || die "ожидалось 102 файла синхронизации, получено $files"
            echo "FILES_TOTAL=$files" >> "$GITHUB_ENV"
          fi

          patch_vercel_json "$BR"

          files=$(git diff --name-only origin/main HEAD | grep -v '^vercel.json$' | wc -l)
          echo "итог: $files файлов + vercel.json"
          # Мир-коммит обязан быть внутри: 21 путь обязан присутствовать в диффе.
          world_files=$(git diff --name-only 4dae307 "$WORLD_SHA" 2>/dev/null || true)
          [ -n "$world_files" ] || world_files=$(git show --name-only --format= "$WORLD_SHA")
          echo "файлов в коммите мира: $(echo "$world_files" | wc -l)"
          missing=0
          for f in $world_files; do
            git diff --name-only origin/main HEAD | grep -qx "$f" || { echo "::warning::нет в диффе: $f"; missing=$((missing+1)); }
          done
          echo "недостающих файлов мира: $missing"
          [ "$missing" -eq 0 ] || die "в диффе не хватает файлов мира ($missing)"
          echo "WORLD_FILES=$(echo "$world_files" | wc -l)" >> "$GITHUB_ENV"
          echo "недостающих файлов мира: $miss"
          [ "$miss" -eq 0 ] || die "в диффе не хватает файлов мира ($miss)"
        env:
          MODE: ${{ env.MODE }}

      - name: Gate — tsc, build, dev server, qa:all, бюджеты чанков
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          phase "npm ci"
          step_run "npm ci" npm ci --no-audit --no-fund
          phase "tsc -b"
          step_run "tsc -b" npx tsc -b
          phase "build"
          step_run "build" npm run build

          phase "бюджеты чанков"
          main_file=$(ls -S dist/assets/index-*.js | head -1)
          main_kb=$(gzip -c "$main_file" | wc -c | awk '{printf "%d", $1/1024}')
          world_file=$(ls dist/assets/WorldMap-*.js 2>/dev/null | head -1 || true)
          if [ -z "$world_file" ]; then die "нет отдельного чанка WorldMap — ленивый импорт сломан"; fi
          world_bytes=$(gzip -c "$world_file" | wc -c)
          world_kb=$(( world_bytes / 1024 ))
          echo "main chunk ($main_file): ${main_kb} KB gzip | WorldMap ($world_file): ${world_bytes} B gzip"
          [ "$main_kb" -le 111 ] || die "main chunk ${main_kb} KB gzip > 111 KB"
          [ "$world_bytes" -le 3072 ] || die "WorldMap ${world_bytes} B gzip > 3 KB"
          echo "CHUNK_MAIN_KB=$main_kb" >> "$GITHUB_ENV"
          echo "CHUNK_WORLD_B=$world_bytes" >> "$GITHUB_ENV"

          # qa:profile-inventory (внутри qa:all) ходит по HTTP на /api/* —
          # нужен живой dev-сервер с vercel-api-dev-plugin.
          phase "dev server 5173"
          npm run dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "http://127.0.0.1:5173/"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 20 "$RUNNER_TEMP/dev.log"
            dump_log "dev server 5173" "$RUNNER_TEMP/dev.log"
            die "dev-сервер не поднялся на 127.0.0.1:5173 за 90 с"
          fi
          export API_BASE="http://127.0.0.1:5173"
          echo "dev-сервер готов (pid $dev_pid)"

          phase "qa:all"
          set +e
          npm run qa:all > "$RUNNER_TEMP/qa-world.log" 2>&1
          qa_code=$?
          set -e
          kill "$dev_pid" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/qa-world.log"
          pass=$(grep -c '^PASS' "$RUNNER_TEMP/qa-world.log" || true)
          fail=$(grep -c '^FAIL' "$RUNNER_TEMP/qa-world.log" || true)
          echo "PASS-строк: $pass | FAIL-строк: $fail"
          echo "QA_PASS=$pass" >> "$GITHUB_ENV"
          echo "QA_FAIL=$fail" >> "$GITHUB_ENV"
          if [ "$qa_code" -ne 0 ] || [ "$fail" -ne 0 ]; then
            echo "::error::QA упал (exit $qa_code, fail $fail)"
            grep -E '^FAIL|Error|error' "$RUNNER_TEMP/qa-world.log" | head -5 | while IFS= read -r line; do echo "::error::  $line"; done
            dump_log "qa:all на $TARGET_BRANCH" "$RUNNER_TEMP/qa-world.log"
            exit 1
          fi
          grep -E 'Onboarding QA|Client events QA|World QA|QA: [0-9]+ checks' "$RUNNER_TEMP/qa-world.log" || true
          # Обязательные наборы: онбординг 33/0, воронка 21/0, мир 47/0.
          grep -q 'QA: 47 checks — PASS 47 / FAIL 0' "$RUNNER_TEMP/qa-world.log" || die "World QA не отдал 47/0"
          git status --porcelain || true

      - name: Push branch
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          phase "push $TARGET_BRANCH"
          step_run "push $TARGET_BRANCH" push_branch "$TARGET_BRANCH"
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: BLOCKED — delta невозможен (ACTION REQUIRED)
        if: env.DELTA_BLOCKED == '1'
        run: |
          set -euo pipefail
          {
            echo "## ACTION REQUIRED — delta-режим невозможен"
            echo ""
            echo "Коммит мира нельзя положить на main 21 файлом: main (b288f11) содержит"
            echo "только cherry-pick A и B, без линии v4.3–v5.4. Не хватает"
            echo "\`shared/backdrops.config.ts\`, \`src/components/LocationPicker.tsx\`,"
            echo "\`stats.deskBackdrop\`, полей темы — tsc падает на 13+ ошибках."
            echo ""
            echo "Ветка НЕ запушена, main не тронут. Перезапустите workflow в режиме"
            echo "\`full\` (workflow_dispatch → mode=full) или локально:"
            echo "\`gh workflow run land-world.yml -f mode=full\`."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::ACTION REQUIRED: перезапустите land-world в режиме full"

      - name: PR + squash merge
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          cat > "$RUNNER_TEMP/pr-world.md" <<MD
          ## Что внутри (мир v2, фаза 1)

          * **Локации и уровневые гейты.** 6 локаций (Комната — хаб, Улица с 1, Пляж с 5,
            Интернет-кафе с 10, Тех-хаб с 20, Корп-квартал с 40) в \`shared/world.config.ts\`;
            миссии получили \`locationId\`, витрина собирается под локацию игрока
            (\`pickMissionOffer\` → \`scopeOfferPool\`), пустая локация падает на Улицу.
          * **Карта города.** \`WorldMap\` (полноэкранный оверлей, ленивый чанк
            ${CHUNK_WORLD_B} B gzip), кнопка «Выйти» на столе, \`LocationBackdrop\` с одной
            CSS-переменной \`--loc-accent\`; слои: карта 10 < онбординг 20 < хром 30.
          * **Серверный анти-чит.** \`set_location\` (\`/api/skin\`) проверяет уровень, отказ
            на закрытую локацию; \`start\` отклоняет контракт локации, которая не открыта
            (даже если клиент подделал \`missionKey\`).
          * **Флаг worldV2 + kill-switches.** \`WORLD_V2\` (env) → \`window.__HK_FLAGS__.worldV2\`
            → \`VITE_WORLD_V2\`; при выключенном флаге UI, витрина и воронка ведут себя
            как до релиза (\`first_tap\` остаётся шагом воронки).
          * **Воронка first_move.** \`first_move\` вместо \`first_tap\` под флагом; приём в
            \`/api/track\` через \`api/_lib/worldEvents.ts\`; миграция
            \`020_first_move.sql\` **уже применена** в prod (\`llciyqawfbeabkkdsnmc\`):
            индекс \`uq_client_events_funnel_once\` расширен, \`v_funnel\` в
            \`insert_client_event\` содержит \`first_move\`.
          * **QA.** \`scripts/qa/world.mjs\` — 47 проверок, \`qa:world\` в \`qa:all\`.

          ## Состав диффа

          * режим \`${MODE}\`: **${FILES_TOTAL} файлов** (+ \`vercel.json\`: preview для этой
            ветки выключен);
          * дерево ветки проверено как точная копия коммита мира \`21177e8\` (full) —
            исключён «протечка» посторонних правок;
          * \`main\` до PR содержал только cherry-pick A (воронка) и B (онбординг v2),
            без линии v4.3–v5.4, поэтому мир выкатывается вместе с ней.

          ## Проверка (на раннере, до создания PR)

          * \`npm ci\`, \`npx tsc -b\`, \`npm run build\` — зелено;
          * \`npm run qa:all\` — **${QA_PASS} PASS / ${QA_FAIL} FAIL**, включая
            Onboarding QA 33/0, Client events QA 21/0, World QA 47/0;
          * бюджеты: main chunk **${CHUNK_MAIN_KB} KB gzip** (≤ 111),
            WorldMap **${CHUNK_WORLD_B} B gzip** (≤ 3 KB).
          MD
          # Тело PR лежит внутри блочного скаляра YAML, поэтому в файле оно с
          # базовым отступом: снимаем ровно 10 пробелов, иначе Markdown покажет
          # текст как код. Ровно 10 (не диапазон) — вложенные списки целы.
          sed -i 's/^          //' "$RUNNER_TEMP/pr-world.md"
          head -n 3 "$RUNNER_TEMP/pr-world.md"

          phase "PR"
          if ! open_pr "$TARGET_BRANCH" main "$PR_TITLE" "$RUNNER_TEMP/pr-world.md"; then
            echo "::warning::PR нужно создать вручную: gh pr create --base main --head $TARGET_BRANCH --title \"$PR_TITLE\""
            echo "PR_WORLD_PENDING=$TARGET_BRANCH" >> "$GITHUB_ENV"
            num=$(wait_pr_appear "$TARGET_BRANCH" 1800)
            [ -n "${num:-}" ] || die "PR для $TARGET_BRANCH так и не создан — выкатка остановлена"
            echo "PR появился: #$num (создан вручную)"
          else
            num=$PR_NUM
          fi

          echo "PR_NUMBER=$num" >> "$GITHUB_ENV"
          gh pr view "$num" --repo "$REPO" --json url --jq '"PR_URL=" + .url' >> "$GITHUB_ENV"
          echo "PR #$num: $(gh pr view "$num" --repo "$REPO" --json url --jq .url)"

          phase "merge #$num"
          merge_pr "$num"

      - name: Wait PR merged
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          wait_pr_merged "$PR_NUMBER" 1800
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          echo "main HEAD после merge: $(gh api "repos/$REPO/commits/main" --jq .sha)"

      - name: Wait Vercel status on main HEAD
        id: vercel
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "main HEAD = $SHA"
          echo "MAIN_SHA=$SHA" >> "$GITHUB_ENV"

          deadline=$(( SECONDS + 2400 ))
          while [ $SECONDS -lt $deadline ]; do
            state=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[]? | select(.context | test("vercel"; "i"))] | first | .state // ""')
            target=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[]? | select(.context | test("vercel"; "i"))] | first | .target_url // ""')
            run_state=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[]? | select(.name | test("vercel"; "i"))] | first | ((.conclusion // .status) // "")' 2>/dev/null || echo "")
            echo "status=${state:-<нет>} check=${run_state:-<нет>} target=${target:-<нет>}"

            case "$state" in
              success)
                [ -n "$target" ] && echo "DEPLOY_URL=$target" >> "$GITHUB_ENV"
                echo "Vercel: success"
                exit 0
                ;;
              failure|error)
                die "Vercel сообщил $state (target=${target:-нет})"
                ;;
            esac
            if [ "$run_state" = "failure" ] || [ "$run_state" = "timed_out" ]; then
              die "Vercel check-run: $run_state"
            fi
            if [ -z "$state" ] && [ "$run_state" = "success" ]; then
              echo "Vercel: check-run success (commit status отсутствует)"
              exit 0
            fi
            sleep 20
          done
          die "таймаут 40 мин: commit status Vercel на $SHA так и не появился"

      - name: Smoke production (два события воронки)
        if: env.ALREADY_MERGED != '1' && env.DELTA_BLOCKED != '1'
        run: |
          set -euo pipefail
          PROD="${PROD_URL%/}"
          # Уникальный демо-игрок на прогон: иначе first_move попадёт под уникальный
          # индекс воронки от предыдущего запуска и строка не появится.
          SMOKE_ID="${SMOKE_SESSION}-run${GITHUB_RUN_ID}"
          echo "PROD=$PROD | smoke user: $SMOKE_ID"
          echo "SMOKE_ID=$SMOKE_ID" >> "$GITHUB_ENV"

          post_track() { # $1 = json body, $2 = out file
            curl -sS -o "$2" -w '%{http_code}' -X POST "$PROD/api/track" \
              -H 'Content-Type: application/json' \
              -H "Origin: $PROD" \
              -H 'user-agent: QA/1.0 (ci-smoke-world)' \
              -H "x-demo-user-id: $SMOKE_ID" -H 'x-demo-username: CISmokeWorld' \
              --data "$1" || echo 000
          }

          ok_home=0; ok_open=0; ok_move=0
          for i in $(seq 1 24); do
            home=$(curl -sS -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "$PROD/" || echo 000)
            code_open=$(post_track '{"event":"app_opened","meta":{"session":"ci-smoke-world"}}' "$RUNNER_TEMP/t1.out")
            code_move=$(post_track '{"event":"first_move","meta":{"session":"ci-smoke-world","location":"street"}}' "$RUNNER_TEMP/t2.out")

            echo "попытка $i: GET / => $home | app_opened => $code_open | first_move => $code_move"
            [ "$home" = "200" ] && ! grep -qi "Init error" "$RUNNER_TEMP/home.html" && ok_home=1
            [ "$code_open" = "204" ] && ok_open=1
            [ "$code_move" = "204" ] && ok_move=1
            if [ "$ok_home" -eq 1 ] && [ "$ok_open" -eq 1 ] && [ "$ok_move" -eq 1 ]; then break; fi
            sleep 15
          done

          echo "SMOKE_HOME=$ok_home" >> "$GITHUB_ENV"
          echo "SMOKE_OPEN=$ok_open" >> "$GITHUB_ENV"
          echo "SMOKE_MOVE=$ok_move" >> "$GITHUB_ENV"

          if [ "$ok_home" -ne 1 ]; then die "GET / не 200 или содержит 'Init error'"; fi
          if [ "$ok_open" -ne 1 ]; then echo "app_opened body: $(cat "$RUNNER_TEMP/t1.out")"; die "app_opened не 204"; fi
          if [ "$ok_move" -ne 1 ]; then echo "first_move body: $(cat "$RUNNER_TEMP/t2.out")"; die "first_move не 204 (миграция 020 / новый код не живы?)"; fi
          echo "smoke: GET / 200, app_opened 204, first_move 204"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## land-world (mode ${MODE})"
            echo ""
            echo "| шаг | значение |"
            echo "| --- | --- |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| mode | ${MODE} |"
            echo "| файлов в ветке | ${FILES_TOTAL:-—} |"
            echo "| QA в ветке | ${QA_PASS:-—} PASS / ${QA_FAIL:-—} FAIL |"
            echo "| main chunk gzip | ${CHUNK_MAIN_KB:-—} KB |"
            echo "| WorldMap gzip | ${CHUNK_WORLD_B:-—} B |"
            echo "| PR | ${PR_URL:-${PR_WORLD_PENDING:+ветка ${PR_WORLD_PENDING} ждёт ручного PR}} |"
            echo "| main HEAD | ${MAIN_SHA:-—} |"
            echo "| deployment | ${DEPLOY_URL:-—} |"
            echo "| production | ${PROD_URL} |"
            echo "| smoke GET / | ${SMOKE_HOME:-н/д} |"
            echo "| smoke app_opened | ${SMOKE_OPEN:-н/д} |"
            echo "| smoke first_move | ${SMOKE_MOVE:-н/д} |"
            echo "| smoke player | ${SMOKE_ID:-—} |"
            echo ""
            echo "Миграция 020 применена до merge: индекс \`uq_client_events_funnel_once\` и"
            echo "\`v_funnel\` в \`insert_client_event\` содержат \`first_move\` (проверено чтением"
            echo "pg_indexes / pg_get_functiondef в prod)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          true
