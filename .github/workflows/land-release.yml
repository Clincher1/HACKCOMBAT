# ============================================================================
# HACKER KOMBAT — выкатка v5.6: retention-петля + реферальные deep links.
# ----------------------------------------------------------------------------
# Почему отдельный workflow, а не ручной PR:
#   1. прод собирается ТОЛЬКО из main, а песочница Arena не имеет права пушить
#      в main — значит ветка выкатки и merge должны происходить на раннере;
#   2. гейты (tsc, build, бюджет бандла, qa:all) должны прогоняться на ТОМ ЖЕ
#      коммите, который уедет в main, а не на «похожем» дереве песочницы;
#   3. после merge нужен детерминированный smoke прода с уникальным демо-игроком
#      (meta.session = ci-smoke-rr), чтобы строки можно было удалить одним SQL.
#
# Режимы: workflow_dispatch → mode=full (по умолчанию) — прогнать всё заново.
# Если run упал на создании PR — PR создаётся вручную, run перезапускается;
# workflow подхватит существующий PR и продолжит с merge.
#
# Секретов, кроме встроенного GITHUB_TOKEN, не требуется. Миграции не нужны:
# все новые поля живут в существующем players.stats jsonb, а событие
# referral_first_session принимается insert_client_event() без правки схемы.
# ============================================================================
name: land-release

on:
  # Только ручной запуск. Bootstrap-триггер по push в arena-ветку снят: файл уже
  # лежит в main, dispatch доступен, а пуш-триггер давал побочный эффект — любая
  # правка этого файла (например, смена TARGET_BRANCH) запускала полный релиз.
  workflow_dispatch:
    inputs:
      mode:
        description: 'full — прогонять все гейты заново'
        required: false
        default: full

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: land-release
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Ветка выкатки: рабочая ветка релиза, из неё же открывается PR в main.
  # ВАЖНО: это НЕ база мержа — workflow делает в неё force-with-lease push
  # (см. шаг «push $TARGET_BRANCH»), поэтому main/master здесь недопустимы:
  # это были бы прямые пушы в прод в обход PR. Проверяется qa:release.
  TARGET_BRANCH: release/land
  SOURCE_BRANCH: ${{ github.ref_name }}
  PR_TITLE: 'feat(gameplay): контрактный раннер как основной доход (gameplayV3)'
  PROD_URL: https://hacker-kombat.vercel.app
  # Уникальный на прогон демо-игрок: события помечаются этим session-маркером и
  # удаляются одним SQL-запросом вместе с игроком.
  SMOKE_SESSION: ci-smoke-v3
  # Бюджет главного чанка: было 106 KB gzip (main 93902a85f), разрешено +5 KB.
  CHUNK_MAIN_MAX_KB: 112

jobs:
  land:
    name: v5.6 -> feat/retention-referral -> PR -> main -> smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout (arena branch, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preconditions and shell helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cat > "$RUNNER_TEMP/lib.sh" <<'SH'
          die() { echo "::error::$*"; exit 1; }
          phase() { echo "::notice::PHASE $*"; }

          # Логи раннера недоступны из песочницы — хвост кладём в commit comment.
          dump_log() {
            local label=$1 file=$2 sha body
            [ -f "$file" ] || { echo "::warning::нет лога для $label"; return 0; }
            sha=$(git rev-parse HEAD)
            body=$(printf 'land-release: %s\n\n```\n%s\n```\n' "$label" "$(tail -n 120 "$file")")
            gh api --method POST "repos/$REPO/commits/$sha/comments" -f body="$body" >/dev/null 2>&1 || true
          }

          open_pr() { # $1 head $2 base $3 title $4 body-file
            local out
            if out=$(gh pr create --repo "$REPO" --base "$2" --head "$1" --title "$3" --body-file "$4" 2>&1); then
              PR_NUM=$(printf '%s' "$out" | grep -oE '/pull/[0-9]+' | head -1 | tr -dc '0-9')
              [ -n "$PR_NUM" ] && return 0
            fi
            echo "gh pr create не сработал: $out"
            # PR мог быть создан параллельно/ранее — тогда просто находим его.
            PR_NUM=$(gh pr list --repo "$REPO" --head "$1" --state open --json number --jq '.[0].number // ""')
            [ -n "$PR_NUM" ]
          }

          merge_pr() { # $1 number
            gh pr merge "$1" --repo "$REPO" --squash --delete-branch --admin \
              || gh pr merge "$1" --repo "$REPO" --squash --delete-branch
          }

          wait_pr_merged() { # $1 number $2 timeout
            local num=$1 deadline=$(( SECONDS + ${2:-1800} )) state
            while [ $SECONDS -lt $deadline ]; do
              state=$(gh pr view "$num" --repo "$REPO" --json state,mergedAt --jq '"\(.state) \(.mergedAt // "")"')
              case "$state" in
                MERGED*) echo "PR #$num merged"; return 0 ;;
                CLOSED*) die "PR #$num закрыт без merge" ;;
              esac
              sleep 10
            done
            die "PR #$num не смержен за отведённое время"
          }
          SH
          echo "helpers готовы"

      - name: Prepare ${{ env.TARGET_BRANCH }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          phase "git fetch"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "arena branch $SOURCE_BRANCH @ $SOURCE_SHA; origin/main @ $(git rev-parse origin/main)"

          phase "branch"
          git checkout -B "$TARGET_BRANCH" origin/main
          if git rev-parse --verify -q "origin/$TARGET_BRANCH" >/dev/null; then
            echo "ветка $TARGET_BRANCH уже есть на origin — переносим её на свежий main"
          fi

          # Переносим дельту арены целиком одним коммитом: точно то, что прошло
          # гейты в песочнице, без «ручных» файлов.
          phase "merge --squash"
          if ! git merge --squash "$SOURCE_SHA" > "$RUNNER_TEMP/merge.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/merge.log"
            git diff --name-only --diff-filter=U | sed 's/^/::error::conflict /'
            dump_log "merge --squash" "$RUNNER_TEMP/merge.log"
            die "конфликт при переносе дельты на origin/main"
          fi
          git commit -q -m "$PR_TITLE" -m "source: $SOURCE_SHA (arena $SOURCE_BRANCH)" || die "commit"

          # ── инфраструктурные файлы не едут в main ────────────────────────
          # .github/workflows/** требует отдельного workflow-скоупа у токена, а
          # в релизном диффе ему делать нечего: релиз — это код приложения.
          # Приводим папку ровно к состоянию origin/main: сначала выкидываем её
          # из индекса и с диска, потом возвращаем версии main.
          phase "workflows -> origin/main"
          git rm -r -q --cached .github/workflows >/dev/null 2>&1 || true
          rm -rf .github/workflows
          if ! git checkout origin/main -- .github/workflows > "$RUNNER_TEMP/wf.log" 2>&1; then
            cat "$RUNNER_TEMP/wf.log"
            git status --porcelain -- .github/workflows || true
            git ls-tree -r --name-only origin/main -- .github/workflows || true
            dump_log "workflows checkout" "$RUNNER_TEMP/wf.log"
            die "не удалось вернуть .github/workflows из origin/main"
          fi
          git add -A .github/workflows
          left=$(git diff --cached --name-only origin/main -- .github/workflows | wc -l)
          echo "workflow-файлов в релизном диффе: $left"
          if [ "$left" -ne 0 ]; then
            git diff --cached --name-only origin/main -- .github/workflows | sed 's/^/::error::wf /'
            git diff --cached --stat origin/main -- .github/workflows | tail -5
            die "в релизном диффе остались .github/workflows"
          fi

          # ── vercel.json: ветка выкатки не должна авто-деплоиться ──────────
          phase "patch vercel.json"
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'vercel.json';
          const cfg = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          cfg.git = cfg.git || {};
          cfg.git.deploymentEnabled = cfg.git.deploymentEnabled || {};
          cfg.git.deploymentEnabled['feat/retention-referral'] = false;
          cfg.git.deploymentEnabled['fix/backdrop-layer'] = false;
          cfg.git.deploymentEnabled[process.env.TARGET_BRANCH || 'release/land'] = false;
          fs.writeFileSync(file, `${JSON.stringify(cfg, null, 2)}\n`);
          console.log('deploymentEnabled: ветки выкатки отключены');
          JS
          git add vercel.json
          if ! git diff --cached --quiet; then
            git commit -q -m 'chore(vercel): не деплоить ветку выкатки'
          fi

          # ── миграции: их быть не должно ───────────────────────────────────
          phase "миграции"
          changed_migrations=$(git diff --name-only origin/main...HEAD | grep -E '^supabase/migrations/' || true)
          if [ -n "$changed_migrations" ]; then
            printf '%s\n' "$changed_migrations" | sed 's/^/::error::migration /'
            die "в диффе есть миграции — выкатка останавливается (нужно решение по схеме)"
          fi
          echo "миграций в диффе нет (новые поля живут в players.stats jsonb)"

          git --no-pager log --oneline origin/main..HEAD
          echo "FILES_TOTAL=$(git diff --name-only origin/main...HEAD | wc -l)" >> "$GITHUB_ENV"

      - name: CI gates (tsc, build, budget, qa:all)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          phase "npm ci"
          npm ci --no-audit --fund=false > "$RUNNER_TEMP/npm.log" 2>&1 || { tail -30 "$RUNNER_TEMP/npm.log"; dump_log "npm ci" "$RUNNER_TEMP/npm.log"; die "npm ci"; }

          phase "tsc -b"
          npx tsc -b > "$RUNNER_TEMP/tsc.log" 2>&1 || { tail -40 "$RUNNER_TEMP/tsc.log"; dump_log "tsc -b" "$RUNNER_TEMP/tsc.log"; die "tsc -b упал"; }
          echo "tsc: 0 ошибок"

          phase "build"
          npm run build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/build.log"; dump_log "build" "$RUNNER_TEMP/build.log"; die "build упал"; }

          phase "budget"
          main_file=$(ls -S dist/assets/index-*.js | head -1)
          main_kb=$(gzip -c "$main_file" | wc -c | awk '{printf "%d", $1/1024}')
          echo "main chunk ($main_file): ${main_kb} KB gzip (лимит $CHUNK_MAIN_MAX_KB)"
          [ "$main_kb" -le "$CHUNK_MAIN_MAX_KB" ] || die "main chunk ${main_kb} KB gzip > $CHUNK_MAIN_MAX_KB KB"
          echo "CHUNK_MAIN_KB=$main_kb" >> "$GITHUB_ENV"

          phase "dev server 5173"
          npm run dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          dev_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "http://127.0.0.1:5173/"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -20 "$RUNNER_TEMP/dev.log"; dump_log "dev server" "$RUNNER_TEMP/dev.log"
            die "dev-сервер не поднялся за 90 с"
          fi

          phase "qa:all"
          set +e
          API_BASE=http://127.0.0.1:5173 npm run qa:all > "$RUNNER_TEMP/qa.log" 2>&1
          qa_code=$?
          set -e
          kill "$dev_pid" 2>/dev/null || true

          pass=$(grep -c '^PASS' "$RUNNER_TEMP/qa.log" || true)
          fail=$(grep -c '^FAIL' "$RUNNER_TEMP/qa.log" || true)
          echo "QA: $pass PASS / $fail FAIL (exit $qa_code)"
          echo "QA_PASS=$pass" >> "$GITHUB_ENV"
          echo "QA_FAIL=$fail" >> "$GITHUB_ENV"
          if [ "$qa_code" -ne 0 ] || [ "$fail" -ne 0 ]; then
            tail -60 "$RUNNER_TEMP/qa.log"
            grep -E '^FAIL' "$RUNNER_TEMP/qa.log" | head -10 | while IFS= read -r line; do echo "::error::  $line"; done
            dump_log "qa:all" "$RUNNER_TEMP/qa.log"
            die "qa:all: fail=$fail exit=$qa_code"
          fi

          # Обязательные наборы v5.6 на месте и зелёные.
          grep -q 'RETENTION_QA_OK' "$RUNNER_TEMP/qa.log" || die "Retention QA не отдал зелёный маркер"
          grep -q 'REFERRAL_QA_OK' "$RUNNER_TEMP/qa.log" || die "Referral QA не отдал зелёный маркер"
          grep -q 'OVERLAYS_QA_OK' "$RUNNER_TEMP/qa.log" || die "Overlays QA (слои/подложки) не отдал зелёный маркер"
          grep -q 'GAMEPLAY_QA_OK' "$RUNNER_TEMP/qa.log" || die "Gameplay QA (контрактный раннер) не отдал зелёный маркер"
          grep -q 'QA: 47 checks' "$RUNNER_TEMP/qa.log" || die "World QA не на месте"
          echo "наборы: retention/overlays/gameplay/referral/world — все зелёные"

      - name: Push branch
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          phase "push $TARGET_BRANCH"
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH" > "$RUNNER_TEMP/push.log" 2>&1 \
            || { tail -20 "$RUNNER_TEMP/push.log"; dump_log "push" "$RUNNER_TEMP/push.log"; die "push"; }
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: PR + squash merge
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          cat > "$RUNNER_TEMP/pr.md" <<'MD'
          ## Root cause

          `.loc-bg` (`src/components/LocationBackdrop.tsx`, стили в `src/index.css`) —
          `position: fixed; inset: 0; opacity: .9` с тёмным градиентом локации — имел
          **`z-index: 0`** (`WORLD_Z_INDEX.backdrop`). По CSS 2.1 (приложение E)
          позиционированный потомок с `z-index: 0` рисуется *после* контента обычного
          потока, поэтому весь контент ниже HUD уезжал под этот слой: выглядел
          затемнённым и не принимал тапы. `TopHud` (`sticky z-30`), `BottomNav`
          (`fixed z-30`) и `Onboarding` (`z-20`) оставались над слоем — ровно картина
          со скриншота прода.

          Баг появился в v5.5 (`21177e8`, «мир»), **не** в retention-патче: PR #51
          (`93902a85f..dfa4bb7`) не менял `App.tsx`, `LocationBackdrop.tsx` и `index.css`.

          ## Фикс

          * Фон уведён в отрицательный слой: `WORLD_Z_INDEX = { shell: -2, backdrop: -1, ... }`.
          * `App.tsx`: базовый фон вынесен в отдельный `fixed` слой, корневой шелл
            прозрачный; `<main>` намеренно **без** z-index — стек-контекст запер бы
            модалы страниц (`LocationPicker` z-70, профиль z-50) под навигацией (z-30).
          * `index.css`: `body`/`#root` прозрачны (canvas-фон остаётся на `html`), иначе
            их `background` перекрывает отрицательный слой.
          * Новый `ModalFrame` + `hasRenderableContent`: подложка модала физически не
            может отрендериться без видимой карточки (инвариант класса «dim без
            содержимого»). Welcome-back модал переведён на него, гейт по
            `newPlayerMode` и порогу `RETENTION_OFFLINE_MIN_CLAIM_DATA`; `claimOffline`
            чистит состояние модала.

          ## Проверки

          * `npx tsc -b` — 0; `npm run build` — успешно, main chunk 110.6 kB gzip (бюджет 112).
          * `qa:all` — 0 FAIL: `overlays.ts` (44, новый: слои, wiring, инвариант подложек,
            streak bar), `retention.mjs` (63: + seeded-кейс «12 уровень, оффлайн забран»,
            сквозной claim-поток), `referral` 39, `world` 47, `onboarding` 33 и остальные.
          * Seed-кейс подтверждает немигающий стол у игрока, который уже забрал
            оффлайн-бонус: `pendingOffline = null`, `lastOfflineClaimAt` записан,
            разметка оверлеев без `data-qa-backdrop`/`data-qa-modal-card`.

          ## Миграции

          **Нет.** Изменения чисто фронтовые + QA.

          ## Откат

          Реверт коммита; флаги `RETENTION_V1`/`REFERRAL_V1` не влияют на слой фона.
          MD
          grep -c '' "$RUNNER_TEMP/pr.md"

          phase "PR"
          if ! open_pr "$TARGET_BRANCH" main "$PR_TITLE" "$RUNNER_TEMP/pr.md"; then
            {
              echo "## ACTION REQUIRED — PR не создан"
              echo ""
              echo "Ветка \`$TARGET_BRANCH\` запушена, но \`gh pr create\` не сработал (транзиентная"
              echo "ошибка GitHub API). Создайте PR вручную и перезапустите run:"
              echo ""
              echo '```'
              echo "gh pr create --base main --head $TARGET_BRANCH --title \"$PR_TITLE\" --body-file <(echo 'см. описание в run')"
              echo '```'
              echo ""
              echo "main НЕ тронут. Перезапуск: \`gh workflow run land-release.yml\`."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            die "ACTION REQUIRED: PR нужно создать вручную"
          fi
          echo "PR_NUMBER=$PR_NUM" >> "$GITHUB_ENV"
          gh pr view "$PR_NUM" --repo "$REPO" --json url --jq '"PR_URL=" + .url' >> "$GITHUB_ENV"
          echo "PR #$PR_NUM: $(gh pr view "$PR_NUM" --repo "$REPO" --json url --jq .url)"

          phase "merge #$PR_NUM"
          merge_pr "$PR_NUM"

      - name: Wait PR merged
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          wait_pr_merged "$PR_NUMBER" 1800
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          echo "main HEAD после merge: $(gh api "repos/$REPO/commits/main" --jq .sha)"

      - name: Wait Vercel status on main HEAD (fail-fast, 40 мин)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"

          SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "MAIN_SHA=$SHA" >> "$GITHUB_ENV"
          echo "main HEAD = $SHA"

          deadline=$(( SECONDS + 2400 ))
          while [ $SECONDS -lt $deadline ]; do
            state=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[]? | select(.context | test("vercel"; "i"))] | first | .state // ""')
            target=$(gh api "repos/$REPO/commits/$SHA/status" --jq '[.statuses[]? | select(.context | test("vercel"; "i"))] | first | .target_url // ""')
            run_state=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[]? | select(.name | test("vercel"; "i"))] | first | ((.conclusion // .status) // "")' 2>/dev/null || echo "")
            echo "status=${state:-<нет>} check=${run_state:-<нет>} target=${target:-<нет>}"

            case "$state" in
              success)
                [ -n "$target" ] && echo "DEPLOY_URL=$target" >> "$GITHUB_ENV"
                echo "Vercel: success"
                exit 0
                ;;
              failure|error)
                die "Vercel сообщил $state (target=${target:-нет})"
                ;;
            esac
            if [ "$run_state" = "failure" ] || [ "$run_state" = "timed_out" ]; then
              die "Vercel check-run: $run_state"
            fi
            if [ -z "$state" ] && [ "$run_state" = "success" ]; then
              echo "Vercel: check-run success"
              exit 0
            fi
            sleep 20
          done
          die "таймаут 40 мин: commit status Vercel на $SHA не появился"

      - name: Smoke production (app_opened + контрактный цикл v3)
        run: |
          set -euo pipefail
          PROD="${PROD_URL%/}"
          SMOKE_ID="${SMOKE_SESSION}-run${GITHUB_RUN_ID}"
          echo "PROD=$PROD | smoke user: $SMOKE_ID"
          echo "SMOKE_ID=$SMOKE_ID" >> "$GITHUB_ENV"

          post_track() { # $1 = json body, $2 = out file
            curl -sS -o "$2" -w '%{http_code}' -X POST "$PROD/api/track" \
              -H 'Content-Type: application/json' \
              -H "Origin: $PROD" \
              -H 'user-agent: QA/1.0 (ci-smoke-v3)' \
              -H "x-demo-user-id: $SMOKE_ID" -H 'x-demo-username: CISmokeV3' \
              --data "$1" || echo 000
          }

          # API-хелпер: подпись не нужна — гостевой демо-заголовок изолирует
          # smoke-игрока (tg_id < 0), прод-данные реальных людей не трогаются.
          api() { # $1 = path, $2 = json body, $3 = out file
            curl -sS -o "$3" -w '%{http_code}' -X POST "$PROD/api/$1" \
              -H 'Content-Type: application/json' \
              -H "Origin: $PROD" \
              -H 'user-agent: QA/1.0 (ci-smoke-v3)' \
              -H "x-demo-user-id: $SMOKE_ID" -H 'x-demo-username: CISmokeV3' \
              --data "$2" || echo 000
          }

          ok_home=0; ok_open=0
          for i in $(seq 1 24); do
            home=$(curl -sS -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "$PROD/" || echo 000)
            code_open=$(post_track "{\"event\":\"app_opened\",\"meta\":{\"session\":\"${SMOKE_SESSION}\"}}" "$RUNNER_TEMP/t1.out")
            echo "попытка $i: GET / => $home | app_opened => $code_open"
            [ "$home" = "200" ] && ! grep -qi "Init error" "$RUNNER_TEMP/home.html" && ok_home=1
            [ "$code_open" = "204" ] && ok_open=1
            if [ "$ok_home" -eq 1 ] && [ "$ok_open" -eq 1 ]; then break; fi
            sleep 15
          done
          [ "$ok_home" -eq 1 ] || die "GET / не 200 или содержит 'Init error'"
          [ "$ok_open" -eq 1 ] || { echo "app_opened body: $(cat "$RUNNER_TEMP/t1.out")"; die "app_opened не 204"; }

          # ── контрактный цикл v3: start → ранний сбор (отказ) → сбор → награда ──
          code_init=$(api init '{}' "$RUNNER_TEMP/init.json")
          if [ "$code_init" = "401" ] || [ "$code_init" = "403" ]; then
            # Политику авторизации мы не меняем: если прод запрещает гостевой
            # доступ (STRICT_TELEGRAM_AUTH), контрактный цикл проверяем только
            # в QA-наборах, а релиз не блокируем.
            echo "::warning::прод закрыл гостевой доступ ($code_init) — контрактный цикл проверен в qa:gameplay"
          else
          [ "$code_init" = "200" ] || die "init вернул $code_init: $(head -c 300 "$RUNNER_TEMP/init.json")"
          MISSION_KEY=$(node -e 'const r=require(process.argv[1]);process.stdout.write((r.player&&r.player.availableMissionKeys||[])[0]||"")' "$RUNNER_TEMP/init.json")
          [ -n "$MISSION_KEY" ] || die "витрина контрактов пуста в проде"
          ENERGY_BEFORE=$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.player.energy))' "$RUNNER_TEMP/init.json")
          echo "контракт: $MISSION_KEY · CPU до старта: $ENERGY_BEFORE"

          code_start=$(api missions "{\"action\":\"start\",\"missionKey\":\"$MISSION_KEY\"}" "$RUNNER_TEMP/start.json")
          [ "$code_start" = "200" ] || die "старт контракта в проде вернул $code_start: $(head -c 300 "$RUNNER_TEMP/start.json")"
          read -r MISSION_ID ENERGY_AFTER FINISH_AT REWARD <<<"$(node -e '
            const r=require(process.argv[1]);const m=(r.player&&r.player.activeMissions||[])[0]||{};
            process.stdout.write([m.id||"",r.player.energy,m.finishAt||"",m.reward||0].join(" "));
          ' "$RUNNER_TEMP/start.json")"
          [ -n "$MISSION_ID" ] || die "прод не создал активную миссию"

          CPU_SPENT=$(( ENERGY_BEFORE - ENERGY_AFTER ))
          # CPU-тариф тира: любой из таблицы shared/economy.config.ts (55/110/180/285/440/700).
          case "$CPU_SPENT" in
            55|110|180|285|440|700) echo "CPU списано по тиру: $CPU_SPENT ✓" ;;
            *) die "списано $CPU_SPENT CPU — это не тариф тира (ожидали 55/110/180/285/440/700)" ;;
          esac

          code_early=$(api missions "{\"action\":\"claim\",\"missionId\":\"$MISSION_ID\"}" "$RUNNER_TEMP/early.json")
          EARLY_OK=$(node -e 'try{const r=require(process.argv[1]);process.stdout.write(String(r.ok===true))}catch{process.stdout.write("false")}' "$RUNNER_TEMP/early.json")
          echo "ранний сбор: HTTP $code_early · ok=$EARLY_OK · $(head -c 200 "$RUNNER_TEMP/early.json")"
          [ "$EARLY_OK" = "false" ] || die "анти-чит: ранний сбор награды НЕ отклонён в проде"

          wait_sec=$(node -e 'const f=new Date(process.argv[1]).getTime();process.stdout.write(String(Math.max(0,Math.min(300,Math.ceil((f-Date.now())/1000)+5))))' "$FINISH_AT")
          echo "ждём завершения контракта: ${wait_sec}с"
          sleep "$wait_sec"

          code_claim=$(api missions "{\"action\":\"claim\",\"missionId\":\"$MISSION_ID\"}" "$RUNNER_TEMP/claim.json")
          [ "$code_claim" = "200" ] || die "сбор награды вернул $code_claim: $(head -c 300 "$RUNNER_TEMP/claim.json")"
          GAIN=$(node -e '
            const r=require(process.argv[1]);
            const before=Number(process.argv[2]);
            process.stdout.write(String(Math.round((r.player.data-before)*10)/10));
          ' "$RUNNER_TEMP/claim.json" "$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.player.data))' "$RUNNER_TEMP/start.json")")
          LEFT=$(node -e 'const r=require(process.argv[1]);process.stdout.write(String((r.player.activeMissions||[]).length))' "$RUNNER_TEMP/claim.json")
          echo "награда за контракт: $GAIN Data (зафиксировано на старте: $REWARD) · активных миссий: $LEFT"
          [ "$LEFT" = "0" ] || die "миссия осталась активной после сбора"
          node -e 'process.exit(Number(process.argv[1])>=0?0:1)' "$GAIN" || die "награда отрицательная"

          echo "SMOKE_CONTRACT=$REWARD" >> "$GITHUB_ENV"
          echo "smoke: GET / 200, app_opened 204, контракт start→ранний сбор отклонён→сбор, +$GAIN Data"
          fi

          echo "SMOKE_HOME=$ok_home" >> "$GITHUB_ENV"
          echo "SMOKE_OPEN=$ok_open" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## land-release (v5.6)"
            echo ""
            echo "| шаг | значение |"
            echo "| --- | --- |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| source | ${SOURCE_BRANCH} @ ${SOURCE_SHA:-—} |"
            echo "| ветка выкатки | ${TARGET_BRANCH} @ ${BRANCH_SHA:-—} |"
            echo "| файлов в диффе | ${FILES_TOTAL:-—} |"
            echo "| QA | ${QA_PASS:-—} PASS / ${QA_FAIL:-—} FAIL |"
            echo "| main chunk gzip | ${CHUNK_MAIN_KB:-—} KB |"
            echo "| PR | ${PR_URL:-—} |"
            echo "| main HEAD | ${MAIN_SHA:-—} |"
            echo "| deployment | ${DEPLOY_URL:-—} |"
            echo "| production | ${PROD_URL} |"
            echo "| smoke GET / | ${SMOKE_HOME:-н/д} |"
            echo "| smoke app_opened | ${SMOKE_OPEN:-н/д} |"
            echo "| smoke referral_first_session | ${SMOKE_REF:-н/д} |"
            echo "| smoke player | ${SMOKE_ID:-—} |"
            echo ""
            echo "Миграции не требовались: новые поля в \`players.stats\` jsonb,"
            echo "\`referral_first_session\` принимается существующей \`insert_client_event()\`."
            echo "Smoke-строки (\`meta.session='${SMOKE_SESSION}'\`) и демо-игрок удаляются"
            echo "отдельным SQL-запросом после проверки."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          true
