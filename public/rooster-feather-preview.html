<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Красный Петух — тап-анимация</title>
  <style>
    :root { color-scheme: dark; font-family: "JetBrains Mono", ui-monospace, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; color: #e8f4ff; background: #070a14; background-image: radial-gradient(circle at 20% 0%, rgba(0,240,255,.13), transparent 42%), radial-gradient(circle at 90% 100%, rgba(255,48,79,.14), transparent 45%), linear-gradient(rgba(0,240,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.035) 1px, transparent 1px); background-size: 100% 100%,100% 100%,28px 28px,28px 28px; }
    .shell { width: min(680px, 100%); }
    .label { margin: 0 0 10px; color: #ffb84d; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .scene { position: relative; aspect-ratio: 16 / 10; overflow: hidden; isolation: isolate; border: 1px solid rgba(255,48,79,.65); border-radius: 22px; cursor: pointer; user-select: none; background: radial-gradient(ellipse at 50% 88%, rgba(255,48,79,.22), transparent 42%), linear-gradient(135deg, #111b34, #080c18 52%, #2c0e1b); box-shadow: 0 0 30px rgba(255,48,79,.22), inset 0 0 34px rgba(255,48,79,.12); }
    .scene::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 4px); pointer-events: none; }
    .terminal { position: absolute; left: 8%; top: 20%; color: rgba(0,240,255,.65); font-size: clamp(9px, 1.8vw, 13px); line-height: 1.7; transform: rotate(-4deg); text-shadow: 0 0 9px rgba(0,240,255,.65); pointer-events: none; }
    .rooster { position: absolute; right: 12%; bottom: 8%; font-size: clamp(48px, 12vw, 92px); filter: drop-shadow(0 0 11px rgba(255,48,79,.85)); opacity: .8; transform: rotate(7deg); pointer-events: none; }
    .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #fff4cf; text-align: center; font-size: clamp(12px, 2.5vw, 18px); font-weight: 900; text-shadow: 0 0 10px #ff304f; pointer-events: none; }
    .hint small { display: block; margin-top: 9px; color: #8ffaff; font-size: 10px; letter-spacing: .08em; }
    .feather { position: absolute; z-index: 5; left: var(--x); top: var(--y); font-size: clamp(22px, 5vw, 34px); line-height: 1; pointer-events: none; transform-origin: 50% 65%; text-shadow: 0 0 3px #fff7d6, 0 0 8px rgba(255,48,79,.95), 0 0 15px rgba(255,184,77,.75); animation: feather-flight 1.05s ease-out forwards; animation-delay: var(--delay); filter: var(--filter); }
    @keyframes feather-flight { 0% { opacity: 0; transform: translate(0,0) scale(.2) rotate(0deg); } 16% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(.72) rotate(var(--rot)); } }
    .byte { position: absolute; z-index: 4; color: #8ffaff; font-size: 12px; font-weight: 900; text-shadow: 0 0 10px #00f0ff; pointer-events: none; animation: byte-up .8s ease-out forwards; }
    @keyframes byte-up { from { opacity: 1; transform: translate(-50%,0) scale(.9); } to { opacity: 0; transform: translate(-50%,-76px) scale(1.12); } }
    button { width: 100%; margin-top: 12px; padding: 15px 20px; border: 0; border-radius: 16px; color: #061018; background: linear-gradient(135deg,#ff304f,#ffb84d); box-shadow: 0 0 28px rgba(255,48,79,.4); font: 900 18px "JetBrains Mono", monospace; letter-spacing: .18em; cursor: pointer; }
    button:active { transform: scale(.97); }
    .caption { margin: 11px 0 0; color: #94a3b8; font-size: 10px; text-align: center; }
    @media (prefers-reduced-motion: reduce) { .feather, .byte { animation-duration: .25s; } }
  </style>
</head>
<body>
  <main class="shell">
    <p class="label">Персональный cosmetic burst · pohoronyat_menya</p>
    <section class="scene" id="scene" aria-label="Демонстрация тап-анимации Красного Петуха">
      <div class="terminal">$ hack --target rooster<br>&gt; feathers loaded<br>&gt; кукареку.exe running</div>
      <div class="rooster">🐓</div>
      <div class="hint">Тапни по сцене<small>каждый успешный тап выпускает 4 пера</small></div>
    </section>
    <button id="hack" type="button">⚡ HACK ⚡</button>
    <p class="caption">В игре эффект появляется только у Telegram ID 495832433 и не меняет Data или энергию.</p>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const hack = document.getElementById('hack');
    const flight = [
      ['-48px','-92px','-58deg','0 0 4px rgba(255,48,79,.9)','red'],
      ['-15px','-118px','-18deg','sepia(.75) saturate(2.5) hue-rotate(355deg) drop-shadow(0 0 4px rgba(255,184,77,.9))','gold'],
      ['23px','-106px','24deg','saturate(2.1) hue-rotate(300deg) drop-shadow(0 0 4px rgba(220,38,38,.9))','scarlet'],
      ['52px','-78px','62deg','sepia(.75) saturate(2.5) hue-rotate(355deg) drop-shadow(0 0 4px rgba(255,184,77,.9))','gold'],
    ];
    let seq = 0;
    function burst(event) {
      const rect = scene.getBoundingClientRect();
      const x = Math.max(6, Math.min(94, ((event.clientX - rect.left) / rect.width) * 100));
      const y = Math.max(12, Math.min(88, ((event.clientY - rect.top) / rect.height) * 100));
      const byte = document.createElement('span');
      byte.className = 'byte'; byte.textContent = '+1 DATA • КУ-КА-РЕ-КУ'; byte.style.left = x + '%'; byte.style.top = y + '%'; scene.append(byte); setTimeout(() => byte.remove(), 850);
      flight.forEach(([dx,dy,rot,filter], i) => {
        const feather = document.createElement('span'); feather.className = 'feather'; feather.textContent = '🪶'; feather.style.setProperty('--x', (x + (Math.random()-.5)*5) + '%'); feather.style.setProperty('--y', (y + (Math.random()-.5)*4) + '%'); feather.style.setProperty('--dx', `calc(${dx} + ${(Math.random()-.5)*24}px)`); feather.style.setProperty('--dy', `calc(${dy} - ${Math.random()*24}px)`); feather.style.setProperty('--rot', `calc(${rot} + ${(Math.random()-.5)*34}deg)`); feather.style.setProperty('--delay', (Math.random()*.08) + 's'); feather.style.setProperty('--filter', filter); feather.dataset.id = ++seq; scene.append(feather); setTimeout(() => feather.remove(), 1300);
      });
    }
    scene.addEventListener('click', burst);
    hack.addEventListener('click', (e) => { const r = scene.getBoundingClientRect(); burst({ clientX: r.left + r.width/2, clientY: r.top + r.height*.7 }); });
    setInterval(() => { const r = scene.getBoundingClientRect(); burst({ clientX: r.left + r.width*(.3 + Math.random()*.4), clientY: r.top + r.height*(.45 + Math.random()*.3) }); }, 2200);
  </script>
</body>
</html>
